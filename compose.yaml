
services:

  server:
    build: .
    image: seamlessnet:dev
    container_name: seamlessnet-server

    user: "0:0"
    init: true

    entrypoint:
      - /bin/sh
      - /usr/local/SeamlessNet/scripts/start-server.sh

    volumes:
      - .:/usr/local/SeamlessNet

    cap_add:
      - NET_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    sysctls:
      net.ipv4.ip_forward: "1"

    networks:
      seamlessnet-net:
        ipv4_address: 172.20.0.10

    healthcheck:
      test: ["CMD-SHELL", "ss -lun | grep -q ':4433'"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s


  web:
    image: python:3.12-alpine
    container_name: seamlessnet-web

    command:
      - sh
      - -c
      - |
        mkdir -p /srv
        printf 'SeamlessNet-HTTP-OK\n' > /srv/index.html
        dd if=/dev/zero of=/srv/test.bin bs=1024 count=64 2>/dev/null
        exec python -m http.server 8080 --bind 0.0.0.0 --directory /srv

    networks:
      seamlessnet-net:
        ipv4_address: 172.20.0.30


  client:
    image: seamlessnet:dev
    container_name: seamlessnet-client

    user: "0:0"
    init: true

    entrypoint:
      - /bin/sh
      - /usr/local/SeamlessNet/scripts/start-client.sh

    volumes:
      - .:/usr/local/SeamlessNet

    cap_add:
      - NET_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_started

    networks:
      seamlessnet-net:
        ipv4_address: 172.20.0.20


networks:
  seamlessnet-net:
    name: seamlessnet-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
